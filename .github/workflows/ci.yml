name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointments_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/appointments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (against PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build
      - name: Docker image builds
        run: docker build -t appointments-api .

  portal:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            app/package-lock.json
      - run: npm ci
      # The reference on the portal is regenerated from the API code on every build.
      - name: Export the OpenAPI spec from the code
        run: npm run openapi
      - name: Portal typecheck, tests and build
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: App typecheck, tests and build
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      # The app is served next to the portal, under /app/.
      - run: cp -r app/dist site/dist/app
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: portal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
